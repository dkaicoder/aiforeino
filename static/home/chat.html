<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AI 智能助手 - AiForEino</title>
  <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
  <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #020617;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    .ai-bubble {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15));
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .user-bubble {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      width: fit-content;
      max-width: 80%;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.3);
      border-radius: 10px;
    }

    @keyframes fadeInSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-animate {
      animation: fadeInSlideUp 0.3s ease-out forwards;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: #3B82F6;
      border-radius: 50%;
      display: inline-block;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    .input-glow:focus {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      border-color: rgba(59, 130, 246, 0.5);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* 磨砂玻璃闪烁轮播 */
    .thought-flash {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 6px;
      padding: 6px 10px;
      animation: flashSlide 1.6s infinite ease-in-out;
    }
    @keyframes flashSlide {
      0% { opacity: 0.6; background: rgba(255,255,255,0.06); }
      50% { opacity: 1; background: rgba(59, 130, 246, 0.15); }
      100% { opacity: 0.6; background: rgba(255,255,255,0.06); }
    }
  </style>
</head>
<body class="text-slate-200">
<canvas id="bgCanvas"></canvas>

<nav class="fixed top-0 left-0 w-full z-50 px-8 py-6 flex items-center justify-between pointer-events-none">
  <div class="flex items-center gap-3 pointer-events-auto cursor-pointer">
    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/20">
      <iconify-icon class="text-white text-2xl" icon="ri:robot-fill"></iconify-icon>
    </div>
    <span class="text-2xl font-bold tracking-tight text-white">AiForEino</span>
  </div>
  <div class="pointer-events-auto">
    <button class="text-slate-400 hover:text-white transition-colors">
      <iconify-icon class="text-2xl" icon="ri:settings-4-line"></iconify-icon>
    </button>
  </div>
</nav>

<main class="relative z-10 w-full h-screen flex items-center justify-center p-4 pt-24">
  <div class="w-full max-w-4xl h-[80vh] glass-panel rounded-3xl flex flex-col overflow-hidden">
    <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/5">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
            <iconify-icon class="text-white text-xl" icon="ri:ai-generate"></iconify-icon>
          </div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-[#0f172a] rounded-full"></div>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-white">AI 智能助手</h2>
          <p class="text-[10px] text-slate-400">基于 EINO RAG 技术构建 • 在线</p>
        </div>
      </div>
      <div class="flex gap-4 items-center">
        <button type="button" id="refresh-history-btn" class="text-xs text-slate-400 hover:text-white transition-colors px-2 py-1 rounded-lg border border-white/10 hover:border-white/20 bg-white/5">
          刷新历史
        </button>
        <iconify-icon class="text-slate-400 cursor-pointer hover:text-white transition-colors" icon="ri:more-2-fill"></iconify-icon>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="chat-container">
      <div class="text-center text-sm text-slate-500 py-12" id="history-loading">加载历史记录中...</div>
    </div>

    <!-- 保留 AI 思考中 loading -->
    <template id="thinking-template">
      <div class="flex flex-col gap-2 items-start message-animate thinking-panel">
        <div class="ai-bubble px-4 py-4 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed shadow-sm">
          <div class="flex items-center gap-2 mb-3">
            <iconify-icon class="text-blue-400 text-sm" icon="line-md:loading-twotone-loop"></iconify-icon>
            <span class="text-xs font-medium text-blue-300 thinking-status-label">AI 思考中</span>
          </div>
          <ul class="space-y-2.5 steps-list"></ul>
        </div>
      </div>
    </template>

    <div class="p-6 bg-white/5 border-t border-white/10">
      <div class="relative flex items-center gap-3">
        <div class="flex-1 relative">
          <input class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-sm focus:outline-none input-glow transition-all placeholder:text-slate-500" id="user-input" placeholder="输入您的问题..." type="text"/>
          <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-3 text-slate-500">
            <iconify-icon class="cursor-pointer hover:text-blue-400 transition-colors" icon="ri:attachment-2"></iconify-icon>
            <iconify-icon class="cursor-pointer hover:text-blue-400 transition-colors" icon="ri:mic-line"></iconify-icon>
          </div>
        </div>
        <button class="w-12 h-12 bg-blue-600 hover:bg-blue-500 rounded-2xl flex items-center justify-center transition-all active:scale-95 shadow-lg shadow-blue-500/20 group" id="send-btn">
          <iconify-icon class="text-white text-xl group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" icon="ri:send-plane-fill" id="send-icon"></iconify-icon>
        </button>
      </div>
      <p class="text-center text-[10px] text-slate-500 mt-4">
        AI 可能会产生误差，请核实重要信息。由 AiForEino 提供技术支持。
      </p>
    </div>
  </div>
</main>

<script>
  // 背景粒子
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let width, height, particles = [];
  const particleCount = 60;
  const maxDistance = 150;

  function initCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        size: Math.random() * 2 + 1
      });
    }
  }

  function drawBackground() {
    const gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width);
    gradient.addColorStop(0, '#0f172a');
    gradient.addColorStop(1, '#020617');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDistance) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(59, 130, 246, ${1 - dist / maxDistance * 0.8})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(drawBackground);
  }

  window.addEventListener('resize', initCanvas);
  initCanvas();
  drawBackground();

  // 聊天逻辑：历史记录 + SSE + 思考进度（保留 thought-flash 轮播样式）
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const sendIcon = document.getElementById('send-icon');
  const thinkingTemplate = document.getElementById('thinking-template');
  const refreshHistoryBtn = document.getElementById('refresh-history-btn');

  const HISTORY_API_URL = '/agent/api/chat/history';
  const MAX_STEP_COUNT = 5;
  let eventSource = null;

  function escapeHtml(unsafe) {
    if (unsafe === undefined || unsafe === null) return '';
    return String(unsafe)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function addMessage(content, isUser = false, opts = {}) {
    const asHtml = opts.asHtml === true;
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const messageDiv = document.createElement('div');
    messageDiv.className = `flex flex-col gap-2 w-full ${isUser ? 'items-end' : 'items-start'} message-animate`;
    let bubbleInner;
    if (asHtml) {
      bubbleInner = content;
    } else {
      const text = String(content);
      bubbleInner = escapeHtml(isUser ? text.trim() : text);
    }
    const bubbleClass = isUser
      ? 'user-bubble px-4 py-3 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow-sm break-words'
      : 'ai-bubble px-4 py-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed shadow-sm whitespace-pre-wrap break-words';
    messageDiv.innerHTML = `<div class="${bubbleClass}">${bubbleInner}</div><span class="text-[10px] text-slate-500 ${isUser ? 'mr-1' : 'ml-1'}">${time}</span>`;
    chatContainer.appendChild(messageDiv);
    scrollToBottom();
  }

  function setUIState(enabled) {
    userInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (!enabled) {
      sendIcon.setAttribute('icon', 'line-md:loading-twotone-loop');
      sendBtn.classList.remove('hover:bg-blue-500');
      sendBtn.classList.add('bg-blue-800', 'cursor-not-allowed');
      userInput.placeholder = 'AI 正在思考中...';
    } else {
      sendIcon.setAttribute('icon', 'ri:send-plane-fill');
      sendBtn.classList.remove('bg-blue-800', 'cursor-not-allowed');
      sendBtn.classList.add('hover:bg-blue-500');
      userInput.placeholder = '输入您的问题...';
      userInput.focus();
    }
  }

  function renderHistoryMessage(role, content) {
    if (role === 'user') {
      addMessage(content, true);
      return;
    }
    if (role === 'assistant') {
      const isUrl = typeof content === 'string' && /^https?:\/\//.test(content);
      if (isUrl) {
        try {
          const u = new URL(content);
          if (u.protocol === 'http:' || u.protocol === 'https:') {
            const href = escapeHtml(u.href);
            addMessage(`处理完成，<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-green-400 underline">点击下载</a>`, false, { asHtml: true });
            return;
          }
        } catch (_) { /* fallthrough */ }
      }
      addMessage(content, false);
    }
  }

  async function loadChatHistory() {
    try {
      chatContainer.innerHTML = '<div class="text-center text-sm text-slate-500 py-12" id="history-loading">加载历史记录中...</div>';
      const response = await fetch(HISTORY_API_URL, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' },
      });
      if (!response.ok) {
        throw new Error(`历史记录接口请求失败: ${response.status}`);
      }
      const historyList = await response.json();
      chatContainer.innerHTML = '';
      if (!historyList || historyList.length === 0) {
        const welcomeHtml = '你好！我是 <span class="text-blue-400 font-semibold">AiForEino</span> 智能助手，有什么可以帮你的吗？';
        addMessage(welcomeHtml, false, { asHtml: true });
      } else {
        historyList.forEach((msg) => renderHistoryMessage(msg.role, msg.content));
      }
      scrollToBottom();
    } catch (err) {
      console.error('加载历史记录失败:', err);
      chatContainer.innerHTML = `<div class="text-center text-sm text-red-400 py-12">加载历史记录失败：${escapeHtml(err.message)}</div>`;
    }
  }

  function generateRequestId() {
    return 'req_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }

  function appendThinkingStep(stepsList, text) {
    const stepItem = document.createElement('li');
    stepItem.className = 'flex items-center gap-2 text-[11px] text-slate-300 thought-flash';
    stepItem.innerHTML = `<span>${text}</span>`;
    stepsList.appendChild(stepItem);
    while (stepsList.children.length > MAX_STEP_COUNT) {
      stepsList.removeChild(stepsList.firstChild);
    }
    scrollToBottom();
  }

  function sendMessage() {
    const inputText = userInput.value.trim();
    if (!inputText) return;

    const requestId = generateRequestId();
    userInput.value = '';
    setUIState(false);
    addMessage(inputText, true);

    const frag = thinkingTemplate.content.cloneNode(true);
    const thinkingPanel = frag.querySelector('.thinking-panel');
    const stepsList = thinkingPanel.querySelector('.steps-list');
    thinkingPanel.id = 'thinking-' + requestId;
    stepsList.id = 'thinking-steps-' + requestId;

    const replyWrap = document.createElement('div');
    replyWrap.className = 'flex flex-col gap-2 items-start message-animate hidden';
    replyWrap.id = 'ai-reply-wrap-' + requestId;
    replyWrap.innerHTML = `
      <div class="ai-bubble px-4 py-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed shadow-sm whitespace-pre-wrap" id="ai-content-${requestId}"></div>
      <span class="text-[10px] text-slate-500 ml-1" id="ai-time-${requestId}"></span>
    `;

    chatContainer.appendChild(thinkingPanel);
    chatContainer.appendChild(replyWrap);
    scrollToBottom();

    if (eventSource) {
      eventSource.close();
      eventSource = null;
    }
    const encodedInput = encodeURIComponent(inputText);
    eventSource = new EventSource('/agent/api/stream?question=' + encodedInput + '&requestId=' + encodeURIComponent(requestId));

    let thinkingQueue = [];
    let isProcessingThinking = false;
    let hasReceivedData = false;
    let toolCompleted = false;
    let agentReply = '';

    function processThinkingQueue() {
      if (isProcessingThinking || thinkingQueue.length === 0) return;
      isProcessingThinking = true;
      const stepsContainer = document.getElementById('thinking-steps-' + requestId);
      if (!stepsContainer) {
        isProcessingThinking = false;
        return;
      }

      function showNextStep() {
        if (thinkingQueue.length === 0) {
          isProcessingThinking = false;
          return;
        }
        const jsonData = thinkingQueue.shift();
        hasReceivedData = true;
        const statusText = jsonData.status === 'start' ? '开始' : '完成';
        const timeLabel = jsonData.time ? (jsonData.time.split(' ')[1] || jsonData.time) : '';
        const nodeName = escapeHtml(jsonData.node || '');
        const stepText = timeLabel
          ? `${nodeName} ${statusText} (${escapeHtml(timeLabel)})`
          : `${nodeName} ${statusText}`;
        appendThinkingStep(stepsContainer, stepText);
        if (thinkingQueue.length > 0) {
          setTimeout(showNextStep, 500);
        } else {
          isProcessingThinking = false;
        }
      }
      showNextStep();
    }

    function updateToolStatus(data) {
      hasReceivedData = true;
      toolCompleted = true;
      const thinkingArea = document.getElementById('thinking-' + requestId);
      const label = thinkingArea && thinkingArea.querySelector('.thinking-status-label');
      if (label) label.textContent = '工具处理完成，正在整理回复...';
      if (data.status === 'error') {
        const replyEl = document.getElementById('ai-reply-wrap-' + requestId);
        const aiContent = document.getElementById('ai-content-' + requestId);
        if (thinkingArea) thinkingArea.style.display = 'none';
        if (replyEl) replyEl.classList.remove('hidden');
        if (aiContent) {
          aiContent.classList.add('border-l-2', 'border-red-400', 'text-red-300');
          aiContent.textContent = data.msg || '工具处理失败';
        }
        const timeEl = document.getElementById('ai-time-' + requestId);
        if (timeEl) {
          timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
        setUIState(true);
      }
    }

    function showAgentReply() {
      const thinkingArea = document.getElementById('thinking-' + requestId);
      const aiContent = document.getElementById('ai-content-' + requestId);
      const replyEl = document.getElementById('ai-reply-wrap-' + requestId);
      const timeEl = document.getElementById('ai-time-' + requestId);

      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      if (thinkingArea) thinkingArea.style.display = 'none';
      if (replyEl) replyEl.classList.remove('hidden');
      if (timeEl) {
        timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      if (aiContent) {
        if (agentReply) {
          aiContent.textContent = agentReply;
        } else if (toolCompleted) {
          aiContent.classList.add('text-green-300', 'border-l-2', 'border-green-400');
          let urlData = {};
          try {
            urlData = JSON.parse(localStorage.getItem('toolUrl_' + requestId) || '{}') || {};
          } catch (_) { urlData = {}; }
          if (urlData.url) {
            const href = escapeHtml(urlData.url);
            aiContent.innerHTML = '处理完成，<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="text-green-400 underline">点击下载</a>（Agent总结：暂无回复）';
          } else {
            aiContent.textContent = '处理完成';
          }
        }
      }
      setUIState(true);
    }

    eventSource.addEventListener('message', (event) => {
      if (event.data === '[DONE]') {
        showAgentReply();
        return;
      }
      if (!event.data.trim()) return;
      hasReceivedData = true;
      const aiContent = document.getElementById('ai-content-' + requestId);
      const thinkingArea = document.getElementById('thinking-' + requestId);
      const replyEl = document.getElementById('ai-reply-wrap-' + requestId);
      if (thinkingArea) thinkingArea.style.display = 'none';
      if (replyEl) replyEl.classList.remove('hidden');
      if (aiContent) {
        agentReply += event.data;
        aiContent.textContent = agentReply;
        const timeEl = document.getElementById('ai-time-' + requestId);
        if (timeEl && !timeEl.textContent) {
          timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
      }
      scrollToBottom();
    });

    eventSource.addEventListener('startprogress', (event) => {
      try {
        thinkingQueue.push(JSON.parse(event.data));
        processThinkingQueue();
      } catch (e) {
        console.error('解析 startprogress 失败:', e);
      }
    });

    eventSource.addEventListener('endprogress', (event) => {
      try {
        thinkingQueue.push(JSON.parse(event.data));
        processThinkingQueue();
      } catch (e) {
        console.error('解析 endprogress 失败:', e);
      }
    });

    eventSource.addEventListener('progress', (event) => {
      let jsonData = null;
      try {
        jsonData = JSON.parse(event.data);
      } catch (e) {
        updateToolStatus({ status: 'error', msg: event.data });
        return;
      }
      updateToolStatus(jsonData);
      if (jsonData.status === 'completed' && jsonData.url) {
        localStorage.setItem('toolUrl_' + requestId, JSON.stringify({ url: jsonData.url }));
      }
    });

    eventSource.onerror = () => {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      if (hasReceivedData) {
        setUIState(true);
        return;
      }
      const aiContent = document.getElementById('ai-content-' + requestId);
      const thinkingArea = document.getElementById('thinking-' + requestId);
      const replyEl = document.getElementById('ai-reply-wrap-' + requestId);
      if (thinkingArea) thinkingArea.style.display = 'none';
      if (replyEl) replyEl.classList.remove('hidden');
      if (aiContent) {
        aiContent.classList.add('border-l-2', 'border-red-400', 'text-red-300');
        aiContent.textContent = '连接异常，请稍后重试';
      }
      const timeEl = document.getElementById('ai-time-' + requestId);
      if (timeEl && !timeEl.textContent) {
        timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      setUIState(true);
    };
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
  if (refreshHistoryBtn) {
    refreshHistoryBtn.addEventListener('click', () => loadChatHistory());
  }

  userInput.addEventListener('focus', () => {
    userInput.parentElement.classList.add('scale-[1.01]');
  });
  userInput.addEventListener('focusout', () => {
    userInput.parentElement.classList.remove('scale-[1.01]');
  });

  window.addEventListener('load', () => {
    loadChatHistory();
  });
</script>
</body>
</html>
